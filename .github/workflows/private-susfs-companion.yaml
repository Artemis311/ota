name: Private SUSFS companion hotfix (existing test2 OTA)

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-susfs-companion.yaml

permissions:
  contents: read

concurrency:
  group: private-susfs-companion-hotfix
  cancel-in-progress: false

jobs:
  companion:
    if: github.repository == 'Artemis311/ota' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-user binutils
      - name: Build and test companion
        run: |
          python3 -m py_compile .github/scripts/build_susfs_test.py
          python3 .github/scripts/build_susfs_test.py dist
      - name: Prepare supplemental manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          root = Path("dist")
          out = Path("hotfix")
          out.mkdir()
          for source, target in [
              ("SUSFS-APatch-test2.1-v2.3.0-r18.4-blazer.zip", "SUSFS-APatch-test2.1-v2.3.0-r18.4-blazer.zip"),
              ("SUSFS-TEST-INSTRUCTIONS.txt", "SUSFS-test2.1-INSTRUCTIONS.txt"),
              ("SUSFS-PROVENANCE.json", "SUSFS-test2.1-PROVENANCE.json"),
          ]:
              shutil.copyfile(root / source, out / target)
          data = {
              "repository_commit": os.environ["GITHUB_SHA"],
              "compatible_ota_release_id": 423632148,
              "compatible_ota_commit": "67f9525ea5296f6c2b80ec626478f7e017a46772",
              "hardware_loaded": False,
              "change": "Fix false adapter-missing check using current-boot initialization evidence",
              "files": {p.name: {"sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                                  "size": p.stat().st_size} for p in sorted(out.iterdir())},
          }
          (out / "SUSFS-test2.1-MANIFEST.json").write_text(json.dumps(data, indent=2) + "\n")
          (out / "SUSFS-test2.1-SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in sorted(out.iterdir())))
          PY
      - name: Attach only to existing private draft and verify uploads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, urllib.parse
          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == "Artemis311/ota"
          endpoint = f"repos/{repo}/releases/423632148"
          def gh(*args, **kw):
              return subprocess.run(["gh", "api", *args], check=True, capture_output=True, text=True, **kw).stdout
          release = json.loads(gh(endpoint))
          assert release["draft"] is True
          assert release["target_commitish"] == "67f9525ea5296f6c2b80ec626478f7e017a46772"
          before = {a["name"]: a for a in release["assets"]}
          out = Path("hotfix")
          files = sorted(out.iterdir())
          # Never replace firmware, original checksums, or existing assets.
          assert not (set(before) & {p.name for p in files}), "Hotfix assets already exist; refusing overwrite"
          upload = release["upload_url"].split("{", 1)[0]
          assert upload.startswith(f"https://uploads.github.com/repos/{repo}/releases/")
          for path in files:
              current = json.loads(gh(endpoint))
              assert current["draft"] is True, "Refusing non-private upload"
              gh("--method", "POST", upload + "?name=" + urllib.parse.quote(path.name, safe=""),
                 "--header", "Content-Type: application/octet-stream", "--input", str(path))
          checked = json.loads(gh(endpoint))
          assert checked["draft"] is True
          assets = {a["name"]: a for a in checked["assets"]}
          assert set(assets) == set(before) | {p.name for p in files}
          for name, asset in before.items():
              assert assets[name]["id"] == asset["id"]
              assert assets[name].get("digest") == asset.get("digest")
          for path in files:
              asset = assets[path.name]
              assert asset["state"] == "uploaded"
              assert asset["size"] == path.stat().st_size
              assert asset["digest"] == "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          notice = "\n\n### SUSFS companion fix: test2.1\nUse **SUSFS-APatch-test2.1-v2.3.0-r18.4-blazer.zip** instead of the original test2 AP module. It fixes the false signature-adapter-missing check. The existing OTA files remain compatible and unchanged; no OTA reinstall is required. Install the ZIP in APatch AP modules, then reboot once. See SUSFS-test2.1-INSTRUCTIONS.txt and SUSFS-test2.1-SHA256SUMS. Kernel loading still requires a phone test.\n"
          gh("--method", "PATCH", endpoint, "--input", "-", input=json.dumps({"body": (release.get("body") or "") + notice, "draft": True}))
          final = json.loads(gh(endpoint))
          assert final["draft"] is True
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("Private updated companion: " + final["html_url"] + "\n\n")
              f.write("Existing firmware preserved; new companion uploads verified by SHA-256.\n")
          print("VERIFIED PRIVATE COMPANION:", final["html_url"])
          PY

# No public Actions artifact upload, OTA rebuild, feed update or release publication.
