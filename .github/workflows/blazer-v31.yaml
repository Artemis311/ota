name: Blazer - pixincreate Magisk v31

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish releases and OTA feeds (leave OFF for the first build)'
        type: boolean
        required: true
        default: false
      ota_version:
        description: 'GrapheneOS version: latest or an exact 10-digit version'
        type: string
        required: true
        default: latest
  schedule:
    - cron: '23 4 * * *'

# Scheduled builds are disabled unless ENABLE_BLAZER_V31_SCHEDULE is true.
# No workflow in this file flashes or otherwise connects to a phone.
permissions:
  contents: read

concurrency:
  group: blazer-pixincreate-v31
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.ENABLE_BLAZER_V31_SCHEDULE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      published: ${{ steps.build.outputs.published }}
    env:
      DEVICE_ID: blazer
      MAGISK_PREINIT_DEVICE: sda10
      MAGISK_VERSION: v31.0-3
      MAGISK_APK_SHA256: ddcd10e42b11e233507f4720c5377f17e6471d27c46c20dba4cbc7afc9355cbc
      SKIP_MAGISK: 'true'
      SKIP_PIXINCREATE: 'false'
      SKIP_ROOTLESS: 'false'
      SKIP_CLEANUP: 'true'
      DEBUG: ''
      OTA_CHANNEL: stable-security-preview
      OTA_VERSION: ${{ inputs.ota_version || 'latest' }}
      PUBLISH: ${{ github.event_name == 'schedule' && 'true' || (inputs.publish && 'true' || 'false') }}
      FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && 'true' || 'false' }}
      PAGES_REPO_FOLDER: ${{ github.workspace }}/ota
    steps:
      - name: Check out inspected upstream build scripts
        uses: actions/checkout@v4
        with:
          repository: schnatterer/rooted-graphene
          ref: 80ff7950d1eb397c3c44c462a19570c1b7aaa8df
          path: builder
          fetch-depth: 1
          persist-credentials: false

      - name: Check out this OTA repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: ota
          fetch-depth: 0

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git unzip openssh-client
          docker version

      - name: Build, sign, and optionally publish
        id: build
        working-directory: builder
        shell: bash
        env:
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          for name in PASSPHRASE_AVB PASSPHRASE_OTA KEY_AVB_BASE64 KEY_OTA_BASE64 CERT_OTA_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          if [[ "$OTA_VERSION" != latest && ! "$OTA_VERSION" =~ ^[0-9]{10}$ ]]; then
            echo '::error::ota_version must be latest or a 10-digit version.'
            exit 1
          fi
          if [[ "$(git hash-object rooted-ota.sh)" != 54bde95262d1f927f93851db70cbcd35ce6311f3 ]]; then
            echo '::error::Unexpected upstream build script. Review before changing the pin.'
            exit 1
          fi

          # The upstream downloader still expects app-release.apk. Preload the
          # verified v31 APK into its cache so that obsolete URL is never used.
          mkdir -p .tmp
          apk=".tmp/pixincreate-${MAGISK_VERSION}.apk"
          curl --fail --location --retry 3 \
            --output "$apk" \
            "https://github.com/pixincreate/Magisk/releases/download/${MAGISK_VERSION}/Magisk-${MAGISK_VERSION}.apk"
          printf '%s  %s\n' "$MAGISK_APK_SHA256" "$apk" | sha256sum --check --strict -

          source rooted-ota.sh
          # A scheduled/publishing run exits successfully here when the exact
          # OS/flavor combination is already published. Test runs force a build.
          createRootedOta
          createOtaServerData

          # Export only explicitly selected public files. NEVER upload .tmp:
          # that directory contains the decoded private signing keys.
          mkdir -p dist
          for asset in "${POTENTIAL_ASSETS[@]}"; do
            cp -- ".tmp/$asset" "dist/$asset"
            cp -- ".tmp/$asset.csig" "dist/$asset.csig"
          done
          cp -- "$CERT_OTA" dist/ota.crt
          printf 'Device: %s\nGrapheneOS: %s\nMagisk: pixincreate/%s\nBuilder commit: %s\n' \
            "$DEVICE_ID" "$OTA_VERSION" "$MAGISK_VERSION" "$(git rev-parse HEAD)" > dist/BUILD_INFO.txt
          (cd dist && sha256sum -- *.zip > SHA256SUMS)
          echo 'built=true' >> "$GITHUB_OUTPUT"

          if [[ "$PUBLISH" == true ]]; then
            # A fresh fork must contain ONLY main, not the upstream gh-pages.
            # Never overwrite or publish an unrelated/inherited update feed.
            (
              cd "$PAGES_REPO_FOLDER"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
                git switch --create gh-pages --track origin/gh-pages
                if [[ ! -f server-owner.txt ]] || [[ "$(cat server-owner.txt)" != "$GITHUB_REPO" ]]; then
                  echo '::error::Existing gh-pages is not this workflow own feed. Refusing to replace it.'
                  exit 1
                fi
              else
                git switch --orphan gh-pages
                touch .nojekyll
                printf '%s\n' "$GITHUB_REPO" > server-owner.txt
                printf '%s\n' '<!doctype html><title>Personal blazer OTA server</title><p>Personal blazer OTA update feed. Do not install without matching signing keys.</p>' > index.html
                git add .nojekyll server-owner.txt index.html
                git commit -m 'Initialize personal blazer OTA server'
                git push --set-upstream origin gh-pages
              fi
              git switch main
            )
            releaseOta
            uploadOtaServerData
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Test build only: no release or OTA feed was published.'
          fi

      - name: Upload public build artifacts
        if: always() && steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blazer-pixincreate-v31-${{ github.run_id }}
          path: builder/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf -- builder/.tmp

  deploy-pages:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public update feed
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ota-site
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ota-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
