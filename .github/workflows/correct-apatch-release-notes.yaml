name: Correct public APatch release notes
'on':
  push:
    branches: [main]
    paths: [.github/workflows/correct-apatch-release-notes.yaml]
permissions:
  contents: read
jobs:
  correct-notes:
    if: github.repository == 'Artemis311/ota' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove the obsolete private SUSFS test reminder from the public description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          endpoint = "repos/Artemis311/ota/releases/424714647"
          def read():
              return json.loads(subprocess.run(["gh", "api", endpoint], capture_output=True, text=True, check=True).stdout)
          release = read()
          if release["tag_name"] != "blazer-2026102101-apatch-11282-bbrv1" or release["draft"]:
              raise RuntimeError("Unexpected release")
          assets = [(a["id"], a["name"], a["digest"]) for a in release["assets"]]
          sentence = " If the old `susfs_apatch_test` AP module is installed, uninstall it before updating; data modules survive an OTA."
          body = release["body"]
          if body.count(sentence) > 1:
              raise RuntimeError("Unexpected duplicate reminder")
          updated = body.replace(sentence, "", 1)
          if "susfs" in updated.lower():
              raise RuntimeError("Unexpected additional SUSFS text")
          if updated != body:
              subprocess.run(["gh", "api", "--method", "PATCH", endpoint, "--input", "-"],
                             input=json.dumps({"body": updated}), capture_output=True, text=True, check=True)
          checked = read()
          if checked["body"] != updated or [(a["id"], a["name"], a["digest"]) for a in checked["assets"]] != assets:
              raise RuntimeError("Release verification failed")
          print("Corrected public description:", checked["html_url"])
          PY
