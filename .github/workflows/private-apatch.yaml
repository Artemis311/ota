name: Blazer - private SUSFS test2 and automatic BBR (draft download only)

'on':
  workflow_dispatch:
    inputs:
      ota_version:
        description: 'GrapheneOS version: latest or an exact 10-digit version (never downgrade)'
        type: string
        required: true
        default: '2026102101'
  push:
    branches: [main]
    paths:
      - .github/workflows/private-apatch.yaml
      - .github/scripts/build_susfs_test.py
      - .github/scripts/build_susfs_adapter.py
      - .github/scripts/prepare_private_bbr.py
      - .github/scripts/private_bbr_module.py
      - .github/kpm/**

permissions:
  contents: read

concurrency:
  group: blazer-private-apatch
  cancel-in-progress: false

jobs:
  private-build:
    if: github.repository == 'Artemis311/ota' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      OTA_VERSION: ${{ inputs.ota_version || '2026102101' }}
      GH_PROMPT_DISABLED: '1'
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: ota
          persist-credentials: false
      - name: Check out inspected APatch builder
        uses: actions/checkout@v4
        with:
          repository: david568303/apatch-graphene
          ref: c1d7484af159e573afddaf351b485f2e0995e530
          path: builder
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git unzip openssh-client python3 gh cmake build-essential xz-utils clang lld qemu-user
          docker version
      - name: Prepare private build and validate shell syntax
        shell: bash
        run: |
          mkdir -p ota/.github/scripts
          cat > ota/.github/scripts/private_apatch.py <<'PY_PRIVATE_HELPER'
          """Prepare a pinned APatch builder and store its output in a draft release only."""
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import sys
          from pathlib import Path
          
          BUILDER_COMMIT = "c1d7484af159e573afddaf351b485f2e0995e530"
          SCRIPT_BLOB = "997cbd963103403d7e3d30b2e19a26bdab8d39f1"
          KERNELPATCH_COMMIT = "280d32d967feb7ddc0fd1848aa1d1388807945d5"
          
          
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)
          
          
          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError("Pinned builder differs from the inspected source")
              return text.replace(old, new, 1)
          
          
          def prepare():
              root = Path(os.environ["GITHUB_WORKSPACE"])
              builder = root / "builder"
              actual = run("git", "-C", str(builder), "rev-parse", "HEAD", capture_output=True, text=True).stdout.strip()
              if actual != BUILDER_COMMIT:
                  raise RuntimeError("Unexpected builder checkout")
              source = builder / "rooted-ota.sh"
              blob = run("git", "-C", str(builder), "hash-object", str(source), capture_output=True, text=True).stdout.strip()
              if blob != SCRIPT_BLOB:
                  raise RuntimeError("Unexpected builder script")
              text = source.read_text(encoding="utf-8")
              # Keep the patched output separate from the original downloaded OTA.
              text = replace_once(text, "    POTENTIAL_ASSETS['apatch']=\"${DEVICE_ID}-ota_update-${OTA_VERSION}.zip\"", "    POTENTIAL_ASSETS['apatch']=\"${DEVICE_ID}-${OTA_VERSION}-apatch-private-patched.zip\"")
              # A private test OTA must not redirect the system updater to public releases.
              text = replace_once(text, "    buildUpdaterOverlay\n    registerPatchModule 'updater_overlay.py' 'UpdaterOverlayModule'\n", "")
              text = replace_once(text, '        args+=("--module-updater-overlay" ".tmp/updater-overlay.apk")\n', "")
              text = replace_once(text,
                  '  expected=("Files $dir/stock/system/fs_tree/system/etc/security/otacerts.zip and $dir/patched/system/fs_tree/system/etc/security/otacerts.zip differ"\n'
                  '    "Only in $dir/patched/product/fs_tree/overlay: UpdaterOverlay.apk")\n'
                  '  python3 -I updater-overlay/check_target.py "$dir/stock/system/fs_tree/system/priv-app/Updater/Updater.apk"\n'
                  '  cmp "$dir/patched/product/fs_tree/overlay/UpdaterOverlay.apk" .tmp/updater-overlay.apk\n',
                  '  expected=("Files $dir/stock/system/fs_tree/system/etc/security/otacerts.zip and $dir/patched/system/fs_tree/system/etc/security/otacerts.zip differ")\n')
              # Allow the supported relative-base path only after its symbol validation succeeds.
              text = replace_once(text,
                  "      printRed 'Warning: KernelPatch could not resolve the arm64 relocation table and used its relative-base kallsyms path.'\n",
                  "      printRed 'KernelPatch used relative-base symbol lookup; checking its validation results.'\n      for required in \\\n        'try kallsyms_offsets first for 64-bit relative-base kernel' \\\n        'kallsyms_offsets offset: 0x' \\\n        'pid_vnr verfied sp_el0' \\\n        'memblock_phys_alloc_try_nid: type: t, offset: 0x' \\\n        'patch done: kernel'; do\n        if ! grep -Fq \"$required\" kptools-patch.log; then\n          printRed \"Relative-base validation is incomplete: $required\"\n          exit 1\n        fi\n      done\n      if grep -Eq 'pid_vnr verification failed|resolved symbol table only covers|can.t find kallsyms_num_syms|mismatch relo applied' kptools-patch.log; then\n        printRed 'KernelPatch symbol validation reported an inconsistency.'\n        exit 1\n      fi\n")
              # Private build: only the pinned SELinux filter; verify the exact embedded KPM set.
              text = replace_once(text, "    ./kptools -p -i kernel.ori -k kpimg -o kernel 2>&1 | tee kptools-patch.log", "    ./kptools -p -i kernel.ori -k kpimg -o kernel \\\n      -M \"$PRIVATE_KPM_DIR/selinux_hook.kpm\" -T kpm -V pre-kernel-init \\\n      2>&1 | tee kptools-patch.log\n    verifyPrivateKpms kernel")
              text = replace_once(text, "  cp '.tmp/kptools-linux' \"$workDir/kptools\"\n  cp '.tmp/kpimg-android' \"$workDir/kpimg\"", "  preparePrivateKpms\n  cp '.tmp/kptools-linux' \"$workDir/kptools\"\n  cp '.tmp/kpimg-android' \"$workDir/kpimg\"")
              text = replace_once(text, "    if ! ./kptools -i kernel -l | grep -q 'patched=true'; then", "    verifyPrivateKpms kernel\n    if ! ./kptools -i kernel -l | grep -q 'patched=true'; then")
              text += "\nfunction preparePrivateKpms() {\n  local dir=\"$PWD/.tmp/private-kpms\"\n  mkdir -p \"$dir\"\n  export PRIVATE_KPM_DIR=\"$dir\"\n  local repo=\"$dir/selinux-source\"\n  git init \"$repo\"\n  git -C \"$repo\" remote add origin https://github.com/Admirepowered/selinux_hook.git\n  git -C \"$repo\" fetch --depth 1 origin 8ad91d00b9abd0fb3191d968b74fdc502126f8ca\n  git -C \"$repo\" checkout --detach FETCH_HEAD\n  test \"$(git -C \"$repo\" rev-parse HEAD)\" = 8ad91d00b9abd0fb3191d968b74fdc502126f8ca\n  make -C \"$repo/selinux_hook\" KP_DIR=\"$PWD/$KERNELPATCH_SOURCE_DIR\" TARGET_COMPILE=\"$KERNELPATCH_COMPILE_PREFIX\"\n  cp \"$repo/selinux_hook/selinux_hook_1.1.7.kpm\" \"$dir/selinux_hook.kpm\"\n  python3 \"$GITHUB_WORKSPACE/ota/.github/scripts/build_susfs_adapter.py\" \"$PWD/$KERNELPATCH_SOURCE_DIR\" \"$KERNELPATCH_COMPILE_PREFIX\" \"$dir\"\n  for file in selinux_hook susfs_sig_allow; do\n    test -s \"$dir/$file.kpm\"\n    .tmp/kptools-linux -l -M \"$dir/$file.kpm\" > \"$dir/$file.metadata.txt\"\n    grep -q 'name=' \"$dir/$file.metadata.txt\"\n  done\n  (cd \"$dir\" && sha256sum ./*.kpm > KPM-SHA256SUMS)\n}\n\n\nfunction verifyPrivateKpms() {\n  local kernel=\"$1\"\n  ./kptools -i \"$kernel\" -l > embedded-kpms.txt\n  python3 - embedded-kpms.txt <<'PY_KPM_VERIFY'\nimport re, sys\nfrom pathlib import Path\ntext = Path(sys.argv[1]).read_text()\nentries = re.findall(r\"(?m)^name=([^\\r\\n]+)\\r?\\nevent=([^\\r\\n]+)\\r?$\", text)\nexpected = [(\"selinux_magisk_access_filter\", \"pre-kernel-init\"), (\"susfs_sig_allow\", \"post-kernel-init\")]\nif entries != expected:\n    raise SystemExit(\"Unexpected embedded KPM set or boot event: \" + repr(entries))\nprint(\"Verified exact embedded KPM set: SELinux filter and scoped SUSFS adapter.\")\nPY_KPM_VERIFY\n}\n"
              # Test2: scope the signature exception and set BBR through signed init actions.
              text = replace_once(text, "      -M \"$PRIVATE_KPM_DIR/selinux_hook.kpm\" -T kpm -V pre-kernel-init \\\n", "      -M \"$PRIVATE_KPM_DIR/selinux_hook.kpm\" -T kpm -V pre-kernel-init \\\n      -M \"$PRIVATE_KPM_DIR/susfs_sig_allow.kpm\" -T kpm -V post-kernel-init \\\n")
              text = replace_once(text, "    mv kernel kernel.ori\n", "    mv kernel kernel.ori\n    python3 \"$GITHUB_WORKSPACE/ota/.github/scripts/prepare_private_bbr.py\" kernel.ori ./kptools \"$PRIVATE_KPM_DIR/../private-bbr\"\n")
              text = replace_once(text, "    patchAPatchBootImage\n    if [[ \"$APATCH_PREINSTALL_MANAGER\"", "    patchAPatchBootImage\n    registerPatchModule 'private_bbr.py' 'PrivateBbrModule'\n    if [[ \"$APATCH_PREINSTALL_MANAGER\"")
              text = replace_once(text, "        args+=(\"--patch-arg=--prepatched\" \"--patch-arg\" \"$APATCH_BOOT_IMAGE\")", "        args+=(\"--patch-arg=--prepatched\" \"--patch-arg\" \"$APATCH_BOOT_IMAGE\")\n        args+=(\"--module-private-bbr\" \".tmp/private-bbr\")")
              text = replace_once(text, "  expected=(\"Files $dir/stock/system/fs_tree/system/etc/security/otacerts.zip and $dir/patched/system/fs_tree/system/etc/security/otacerts.zip differ\")\n", "  expected=(\"Files $dir/stock/system/fs_tree/system/etc/security/otacerts.zip and $dir/patched/system/fs_tree/system/etc/security/otacerts.zip differ\"\n    \"Only in $dir/patched/system/fs_tree/system/etc/init: private_bbr.rc\"\n    \"Only in $dir/patched/system/fs_tree/system/etc: private-bbr.json\")\n  cmp \"$dir/patched/system/fs_tree/system/etc/init/private_bbr.rc\" .tmp/private-bbr/private_bbr.rc\n  cmp \"$dir/patched/system/fs_tree/system/etc/private-bbr.json\" .tmp/private-bbr/BBR-PROFILE.json\n")
              (builder / "patch-modules/private_bbr.py").write_text((root / "ota/.github/scripts/private_bbr_module.py").read_text(), encoding="utf-8")
              (builder / "rooted-ota.private.sh").write_text(text, encoding="utf-8", newline="\n")
              (builder / "run-private.sh").write_text(BUILD_SH, encoding="utf-8", newline="\n")
              run("bash", "-n", str(builder / "rooted-ota.private.sh"))
              run("bash", "-n", str(builder / "run-private.sh"))
          
          
          BUILD_SH = r'''#!/usr/bin/env bash
          set -euo pipefail
          umask 077
          for name in KEY_AVB_BASE64 KEY_OTA_BASE64 CERT_OTA_BASE64 PASSPHRASE_AVB PASSPHRASE_OTA; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing repository secret: %s\n' "$name" >&2
              exit 1
            fi
          done
          [[ "$OTA_VERSION" == latest || "$OTA_VERSION" =~ ^[0-9]{10}$ ]] || exit 1
          unset GITHUB_TOKEN GH_TOKEN MAGISK_DOWNLOAD_TOKEN
          export DEVICE_ID=blazer
          export SKIP_ROOTLESS=false SKIP_APATCH=false SKIP_MODULES=true SKIP_CLEANUP=true
          export APATCH_PREINSTALL_MANAGER=false ALLOW_UNVERIFIED_APATCH=false DEBUG=''
          export GITHUB_REPO='' FORCE_BUILD=true
          export APATCH_VERSION=11282 KERNELPATCH_VERSION=0.13.9
          export KERNELPATCH_COMMIT=280d32d967feb7ddc0fd1848aa1d1388807945d5
          source rooted-ota.private.sh
          createRootedOta
          mkdir -p dist
          # Verify that CI is still signing for the AVB key already published by this fork.
          openssl pkey -in "$KEY_AVB" -passin env:PASSPHRASE_AVB -pubout -out .tmp/avb-public.pem
          .tmp/avbroot key encode-avb --public-key .tmp/avb-public.pem -o dist/avb_pkmd.bin
          cmp dist/avb_pkmd.bin ../ota/avb_pkmd.bin
          # The OTA certificate must match the supplied OTA private key.
          openssl pkey -in "$KEY_OTA" -passin env:PASSPHRASE_OTA -pubout -out .tmp/ota-public.pem
          openssl x509 -in "$CERT_OTA" -pubkey -noout > .tmp/cert-public.pem
          cmp .tmp/ota-public.pem .tmp/cert-public.pem
          for flavor in apatch rootless; do
            asset="${POTENTIAL_ASSETS[$flavor]}"
            target="blazer-${OTA_VERSION}-${flavor}-private-test.zip"
            .tmp/avbroot ota verify --input ".tmp/$asset" --cert-ota "$CERT_OTA" --public-key-avb dist/avb_pkmd.bin
            cp -- ".tmp/$asset" "dist/$target"
          done
          downloadVerifiedFile .tmp/apatch-manager.apk "$APATCH_MANAGER_URL" "$APATCH_MANAGER_SHA256"
          cp .tmp/apatch-manager.apk "dist/APatch-${APATCH_VERSION}-release-signed.apk"
          cp -- "$CERT_OTA" dist/ota.crt
          cp .tmp/private-kpms/*.kpm .tmp/private-kpms/*.metadata.txt .tmp/private-kpms/KPM-SHA256SUMS dist/
          cp ".tmp/apatch-${DEVICE_ID}-${OTA_VERSION}/embedded-kpms.txt" dist/KPM-EMBEDDED.txt
          cp .tmp/private-kpms/*.build.json .tmp/private-kpms/*-source.tar.gz dist/
          cp .tmp/private-bbr/BBR-PROFILE.json .tmp/private-bbr/private_bbr.rc .tmp/private-bbr/tcp_bbr-source.c dist/
          export BUILD_OTA_VERSION="$OTA_VERSION" BUILD_APATCH_VERSION="$APATCH_VERSION"
          export BUILD_MANAGER_URL="$APATCH_MANAGER_URL" BUILD_MANAGER_SHA256="$APATCH_MANAGER_SHA256"
          python3 ../ota/.github/scripts/private_apatch.py manifest
          '''
          
          
          INSTALL_NOTES = """Private APatch test2 OTA for Pixel 10 Pro (blazer), not hardware-tested.
          
          This test requires the exact 2026102101 kernel verified from the previous log.
          Use only blazer with the existing repository AVB/OTA keys; never downgrade.
          Use standard recovery adb sideload for an existing setup with these same keys.
          Do not use APatch direct install/update/restore on a locked bootloader.
          The rootless OTA contains no KPMs or BBR startup actions and cannot guarantee
          recovery during a virtual A/B snapshot merge. Data modules survive OTA updates.
          No Custota module or public updater-feed overlay is installed.
          
          Embedded KPMs:
          - SELinux Magisk Access Filter 1.1.7, pre-kernel-init, pinned upstream source.
          - susfs_sig_allow 0.1.0, post-kernel-init, private exact-payload signature adapter.
          NoHello, ReKernel and demo-hello are removed. Do not load these KPMs twice.
          The adapter accepts only the tested kernel and normalized SHA-256 fingerprint
          of one SUSFS .ko. Global signature enforcement stays active for other images.
          The original rejection message may precede the adapter acceptance message.
          Source and host security-test results accompany this release.
          Do not hot-unload the embedded adapter or LKM.
          
          BBR is configured INSIDE the signed OTA:
          - The actual boot kernel config and exact source commit are inspected.
          - BBRv1 is the highest generation present; no BBRv2/v3 code is added.
          - /system/etc/init/private_bbr.rc selects bbr/fq at every boot.
          - /system/etc/private-bbr.json records build evidence.
          - Current interface qdiscs and application-specific TCP choices are not forced.
          - Runtime success needs phone verification via the companion module Action log.
          
          SUSFS test:
          1. Install this NEW test2 OTA; the old OTA lacks the signature adapter.
          2. Wait for snapshot merge to finish.
          3. Install/update SUSFS-APatch-test2-v2.3.0-r18.4-blazer.zip in APatch AP modules,
             NOT the KPM page. This replaces test1 using the same module ID.
          4. Reboot. One SUSFS load attempt runs after boot-completed.
          5. Tap Action: Download/susfs-apatch-test-log.txt contains BBR and SUSFS results.
          Loader static-PIE relocation and error handling are smoke-tested under QEMU.
          Overcoming signatures does NOT prove LKM ABI/CFI/hook compatibility.
          Failed/interrupted SUSFS attempts stay disarmed; BBR still applies every boot.
          Read SUSFS-TEST-INSTRUCTIONS.txt for rearming and removal details.
          This build does not fix the separately observed apd/Vector compatibility issues.
          Disable/remove the SUSFS AP module and reboot to stop runtime loading.
          Removing the embedded adapter or OTA BBR settings needs a newly signed OTA.
          Keep this release a DRAFT. Verify SHA256SUMS before installation.
          """
          
          
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          
          
          def manifest():
              dist = Path("dist")
              version = os.environ["BUILD_OTA_VERSION"]
              if not re.fullmatch(r"[0-9]{10}", version):
                  raise RuntimeError("Invalid resolved OS version")
              (dist / "READ-ME-FIRST.txt").write_text(INSTALL_NOTES)
              data = {
                  "device": "blazer", "grapheneos": version,
                  "hardware_tested": False, "builder_commit": BUILDER_COMMIT,
                  "kpm_profile": "selinux-filter-plus-scoped-susfs-signature-adapter",
                  "bbr_profile": json.loads((dist / "BBR-PROFILE.json").read_text()),
                  "susfs_companion": json.loads((dist / "SUSFS-PROVENANCE.json").read_text()),
                  "kpm_sources": {
                      "selinux_hook": "Admirepowered/selinux_hook@8ad91d00b9abd0fb3191d968b74fdc502126f8ca",
                      "susfs_sig_allow": "local .github/kpm sources at repository_commit"
                  },
                  "kernelpatch_commit": KERNELPATCH_COMMIT,
                  "apatch": os.environ["BUILD_APATCH_VERSION"],
                  "manager_url": os.environ["BUILD_MANAGER_URL"],
                  "manager_sha256": os.environ["BUILD_MANAGER_SHA256"],
                  "repository_commit": os.environ["GITHUB_SHA"],
                  "files": {p.name: {"size": p.stat().st_size, "sha256": digest(p)}
                            for p in sorted(dist.iterdir()) if p.is_file()},
              }
              (dist / "BUILD_MANIFEST.json").write_text(json.dumps(data, indent=2) + "\n")
              (dist / "SHA256SUMS").write_text("".join(
                  f"{digest(p)}  {p.name}\n" for p in sorted(dist.iterdir())
                  if p.is_file() and p.name != "SHA256SUMS"))
          
          
          def publish():
              root = Path(os.environ["GITHUB_WORKSPACE"])
              dist = root / "builder" / "dist"
              data = json.loads((dist / "BUILD_MANIFEST.json").read_text())
              repo = os.environ["GITHUB_REPOSITORY"]
              if repo != "Artemis311/ota":
                  raise RuntimeError("This private build is restricted to Artemis311/ota")
              for name, expected in data["files"].items():
                  if Path(name).name != name or digest(dist / name) != expected["sha256"]:
                      raise RuntimeError("Build output checksum mismatch")
              allowed = set(data["files"]) | {"BUILD_MANIFEST.json", "SHA256SUMS"}
              if {p.name for p in dist.iterdir()} != allowed:
                  raise RuntimeError("Unexpected file in the download directory")
              tag = f'private-apatch-blazer-{data["grapheneos"]}-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}'
              notes = root / "private-release-notes.txt"
              notes.write_text(
                  f'Private APatch test for blazer, GrapheneOS {data["grapheneos"]}.\n\n'
                  'NOT hardware-tested on blazer. Read READ-ME-FIRST.txt before flashing.\n'
                  'Signed using the existing repository AVB/OTA keys; all OTA signatures verified.\n'
                  'Test2 includes a scoped SUSFS signature KPM and automatic BBRv1/fq in the signed APatch OTA. Install the separate SUSFS test2 AP-module ZIP after installing this OTA. Rootless OTA has neither modification. Read SUSFS-TEST-INSTRUCTIONS.txt.\n\n'
                  '**Keep as draft: publishing would expose these downloads publicly.**\n')
              request = {"tag_name": tag, "target_commitish": os.environ["GITHUB_SHA"],
                         "draft": True, "name": f'PRIVATE APatch | SUSFS test2 + auto BBR | blazer {data["grapheneos"]} | {data["apatch"]}',
                         "body": notes.read_text()}
              release = json.loads(run("gh", "api", "--method", "POST", f"repos/{repo}/releases", "--input", "-",
                  input=json.dumps(request), capture_output=True, text=True).stdout)
              if release["draft"] is not True:
                  raise RuntimeError("Release is not private; refusing to upload")
              upload_url = release["upload_url"].split("{", 1)[0]
              if not upload_url.startswith(f"https://uploads.github.com/repos/{repo}/releases/"):
                  raise RuntimeError("Unexpected release upload destination")
              for name in sorted(allowed):
                  run("gh", "api", "--method", "POST", upload_url + "?name=" + urllib.parse.quote(name, safe=""),
                      "--header", "Content-Type: application/octet-stream", "--input", str(dist / name), "--silent")
              checked = json.loads(run("gh", "api", f'repos/{repo}/releases/{release["id"]}',
                  capture_output=True, text=True).stdout)
              assets = {a["name"]: a for a in checked["assets"]}
              if checked["draft"] is not True or set(assets) != allowed:
                  raise RuntimeError("Draft upload verification failed")
              for name, asset in assets.items():
                  path = dist / name
                  if asset["state"] != "uploaded" or asset["size"] != path.stat().st_size:
                      raise RuntimeError("Incomplete draft upload")
                  if asset.get("digest") != "sha256:" + digest(path):
                      raise RuntimeError("Uploaded asset digest mismatch")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f'Private download: {checked["html_url"]}\n\nKeep this release a draft. Hardware test on blazer is still required.\n')
              print("Private draft download:", checked["html_url"])
          
          
          if __name__ == "__main__":
              {"prepare": prepare, "manifest": manifest, "publish": publish}[sys.argv[1]]()
          PY_PRIVATE_HELPER
          python3 ota/.github/scripts/private_apatch.py prepare
      - name: Build and validate pinned SUSFS APatch test companion
        working-directory: builder
        run: python3 ../ota/.github/scripts/build_susfs_test.py dist
      - name: Build and verify APatch and rootless OTAs
        working-directory: builder
        shell: bash
        env:
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
        run: bash run-private.sh
      - name: Upload only to a private release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ota/.github/scripts/private_apatch.py publish
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          sudo rm -rf -- "$GITHUB_WORKSPACE/builder/.tmp"

# Deliberately no upload-artifact, Pages deployment, public release publication,
# scheduled build, or public OTA feed update. Public Actions artifacts are not private.
