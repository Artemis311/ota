name: Remove empty APatch bootstrap draft
'on':
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-apatch-bootstrap.yaml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
    - name: Remove only the empty draft created for the release preflight
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PY'
        import json, subprocess
        endpoint = "repos/Artemis311/ota/releases/424841724"
        draft = json.loads(subprocess.run(["gh", "api", endpoint], check=True, capture_output=True, text=True).stdout)
        assert draft["draft"] is True and draft["assets"] == []
        assert draft["tag_name"] == "blazer-2026102101-apatch-11282-dd9cea063db2"
        subprocess.run(["gh", "api", "--method", "DELETE", endpoint], check=True)
        print("Removed the empty bootstrap draft; public release 424845736 retained")
        PY
