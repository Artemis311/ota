name: Build APatch OTA with integrated Custota
# Verify the intended OTA trust certificate replacement in Android and recovery.
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/apatch-custota.yaml]
permissions:
  contents: read
concurrency:
  group: blazer-ota-publisher
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      deploy: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        path: ota
    - uses: actions/checkout@v4
      with:
        repository: schnatterer/rooted-graphene
        ref: 80ff7950d1eb397c3c44c462a19570c1b7aaa8df
        path: builder
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: david568303/apatch-graphene
        ref: c1d7484af159e573afddaf351b485f2e0995e530
        path: apatch-builder
        persist-credentials: false
    - name: Check installed OTA build tools
      run: |
        for tool in git jq curl unzip ssh-keygen cmake gcc make xz python3 gh openssl docker; do
          command -v "$tool" || exit 1
        done
        docker version
    - name: Validate synchronization and feed code
      run: |
        python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
        python3 -m py_compile ota/.github/scripts/apatch_feed.py ota/.github/scripts/verify_apatch_custota.py
        python3 ota/.github/scripts/apatch_pipeline.py prepare
        python3 ota/.github/scripts/test_synchronized_ota.py
    - name: Build and verify APatch with Custota, then publish OTA and feed
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
        PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
        KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
        CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
        PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, sys, subprocess
        from pathlib import Path
        root = Path(os.environ["GITHUB_WORKSPACE"])
        sys.path.insert(0, str(root / "ota/.github/scripts"))
        from apatch_sync import stage_apatch, publish_apatch, api
        from apatch_feed import prepare_feed, write_feed
        version = "2026102101"
        subprocess.run(["git", "-C", str(root / "ota"), "fetch", "origin", "gh-pages:refs/remotes/origin/gh-pages"], check=True)
        current = json.loads(subprocess.run(["git", "-C", str(root / "ota"), "show",
                                            "origin/gh-pages:BUILD_MANIFEST.json"],
                                           check=True, capture_output=True, text=True).stdout)
        if current["grapheneos"] != version:
            raise RuntimeError("APatch repair must match the currently published Magisk/rootless OS")
        import re
        for release in api("GET", "repos/Artemis311/ota/releases?per_page=100"):
            match = re.match(r"^blazer-([0-9]{10})-", release["tag_name"])
            if not release["draft"] and match and match.group(1) > version:
                raise RuntimeError("Refusing an older OS than an existing public OTA")
        partner = stage_apatch(version, True)
        prepared = prepare_feed(partner)
        publish_apatch(partner)
        repo = root / "ota"
        def git(*args):
            return subprocess.run(["git", "-C", str(repo), *args], check=True,
                                  capture_output=True, text=True).stdout.strip()
        git("switch", "--create", "gh-pages", "--track", "origin/gh-pages")
        if (repo / "server-owner.txt").read_text().strip() != "Artemis311/ota":
            raise RuntimeError("Unexpected feed owner")
        paths = write_feed(repo, prepared)
        git("config", "user.name", "github-actions[bot]")
        git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
        git("add", *paths)
        if git("status", "--porcelain"):
            git("commit", "-m", "Publish signed APatch Custota update channel")
            git("push", "origin", "gh-pages")
        PY
    - name: Remove temporary signing files and downloads
      if: always()
      run: rm -rf -- builder/.tmp apatch-builder/.tmp apatch-feed
  deploy-pages:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Check out public update feed
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: ota-site
        persist-credentials: false
        fetch-depth: 1
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload Pages site
      uses: actions/upload-pages-artifact@v3
      with:
        path: ota-site
    - name: Deploy Pages
      id: deployment
      uses: actions/deploy-pages@v4
    - name: Verify deployed Custota feed
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        set -euo pipefail
        for flavor in pixincreate rootless apatch; do
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/$flavor/blazer.json" -o "$RUNNER_TEMP/$flavor.json"
          python3 - "$RUNNER_TEMP/$flavor.json" "ota-site/$flavor/blazer.json" <<'PY'
        import json, sys
        assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2])), 'Deployed feed does not match the published release'
        PY
        done
        python3 - <<'PY'
        import hashlib, json, os, subprocess
        from pathlib import Path
        record = json.loads(Path("ota-site/apatch/manifest.json").read_text())
        name = record["signature"]
        destination = Path(os.environ["RUNNER_TEMP"]) / "apatch-published.csig"
        subprocess.run(["curl", "--fail", "--silent", "--show-error", "--location",
                        "--retry", "8", "--retry-all-errors", "--retry-delay", "5",
                        os.environ["PAGE_URL"].rstrip("/") + "/apatch/" + name,
                        "-o", str(destination)], check=True)
        assert hashlib.sha256(destination.read_bytes()).hexdigest() == record["csig_sha256"], "Deployed APatch signature differs"
        print("Verified public APatch signature and all three update feeds")
        PY
